name: Publish package

# Publishes @neodisa/liga-ds (Angular library) to GitHub Packages when a version tag is pushed.
# Uses the workflow's built-in GITHUB_TOKEN — no personal tokens or secrets needed.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@neodisa'

      - name: Install dependencies
        run: npm ci

      # Production build → partial compilation → publishable ng-packagr output
      # at projects/liga-ds/dist (only the built package, never the source).
      - name: Build library (production)
        run: npx ng build liga-ds --configuration production

      - name: Publish
        run: npm publish
        working-directory: projects/liga-ds/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
